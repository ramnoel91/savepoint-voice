<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11141b">
<title>Save Point Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first. Lobby = list of voice channels; Call = grid of people + control bar. Same look as Save Point. */
:root {
  --bg: #11141b; --surface: #191e28; --raise: #222937; --line: #2b3342;
  --text: #e8ebf1; --muted: #8d97a9; --accent: #ff7a45; --accent-ink: #1a0d06;
  --live: #3ddc84; --danger: #ff5c6c;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.logo { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.logo small { font-family: var(--font-body); font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: 0; }
header .sp { flex: 1; }
main { flex: 1; overflow-y: auto; padding: 16px 16px calc(env(safe-area-inset-bottom) + 24px); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
h2 { font-family: var(--font-display); font-size: 20px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-size: 16px; margin: 4px 0 0; }
.meta { font-size: 12.5px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none; }
.field input:focus { border-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: 9px 15px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.room { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.room:hover { border-color: var(--muted); }
.room .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--raise); display: grid; place-items: center; color: var(--muted); flex: none; }
.room.live .ic { color: var(--live); background: color-mix(in srgb, var(--live) 14%, transparent); }
.room .t { flex: 1; min-width: 0; }
.room .t b { display: block; font-size: 16px; }
.room .who { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.room.live .who { color: var(--live); }
.room .go { font-size: 13px; font-weight: 700; color: var(--accent); }

/* Call */
.call-head { display: flex; align-items: center; gap: 10px; }
.call-head .t { flex: 1; min-width: 0; }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--live); display: inline-block; margin-right: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; position: relative; }
.av { width: 68px; height: 68px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: #10131a; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px transparent; transition: box-shadow .12s ease; }
.tile.speaking .av { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--live); }
.tile .nm { font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .st { font-size: 12px; color: var(--muted); min-height: 18px; display: flex; gap: 6px; align-items: center; }
.tile .st .bad { color: var(--danger); }
.tile input[type=range] { width: 100%; accent-color: var(--accent); }
.badge-ic { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--danger); display: grid; place-items: center; }
.controls { position: sticky; bottom: 0; display: flex; justify-content: center; gap: 12px; padding: 14px 0 6px; background: linear-gradient(transparent, var(--bg) 30%); }
.cbtn { width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); display: grid; place-items: center; }
.cbtn svg { width: 26px; height: 26px; }
.cbtn.on { background: var(--text); color: var(--bg); }
.cbtn.leave { background: var(--danger); border-color: var(--danger); color: #fff; }
.cbtn-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.banner { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); }
.banner strong { color: var(--text); }
.banner.err { border-left-color: var(--danger); }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
details summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: 10px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.swatch.sel { border-color: var(--text); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 100px); transform: translateX(-50%); background: var(--raise); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; font-size: 13.5px; z-index: 30; display: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { display: block; }
@media (prefers-reduced-motion: reduce) { .av { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="mark"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#1a0d06" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/><path d="M12 9v6M9 12h6"/></svg></div>Save Point <small>Voice</small></div>
  <div class="sp"></div>
  <button class="btn ghost" id="invite-btn">Invite</button>
</header>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  /* ---------- config ---------- */
  const MAX = 6;                                   // people per voice channel
  const DEFAULT_ROOMS = ["lounge", "squad-1", "squad-2", "ranked"];
  const COLORS = ["#ff7a45", "#4fd1c5", "#f6c453", "#8fb3ff", "#ff8fb8", "#a6e36b", "#c39bff", "#ffa96b"];
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 24);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("spv-" + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem("spv-" + k, JSON.stringify(v)); } catch (_) {} }
  };
  let toastT;
  function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3500); }

  /* crew code: everyone with the same code shares the same voice channels */
  const params = new URLSearchParams(location.search);
  let crew = slug(params.get("crew") || store.get("crew", "")).replace(/-/g, "");
  if (!crew) { crew = Math.random().toString(36).slice(2, 10); }
  store.set("crew", crew);
  if (params.get("crew") !== crew) { params.set("crew", crew); history.replaceState(null, "", location.pathname + "?" + params.toString()); }
  const nameParam = (params.get("name") || "").trim().slice(0, 24);
  if (nameParam && !store.get("name", "")) store.set("name", nameParam);
  const roomParam = slug(params.get("room") || "");

  const S = {
    name: store.get("name", ""), color: store.get("color", COLORS[Math.floor(Math.random() * COLORS.length)]),
    turn: store.get("turn", { url: "", user: "", pass: "" }),
    rooms: Array.from(new Set([...(roomParam ? [roomParam] : []), ...DEFAULT_ROOMS, ...store.get("rooms", [])])),
    lobby: {}, probing: false,
    room: null, slot: 0, peer: null, local: null, muted: false, deaf: false, joining: false,
    pending: {},            // slot -> outgoing call not answered yet
    peers: {},              // slot ->{ name, color, muted, deaf, call, conn, stream, el, analyser, speaking, vol }
    meSpeaking: false, ctx: null, meAnalyser: null, err: ""
  };
  const pid = (room, slot) => `savepoint-${crew}-${room}-${slot}`;
  const slotOf = id => +String(id).split("-").pop();
  function iceConfig() {
    const servers = [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }];
    if (S.turn.url) servers.push({ urls: S.turn.url, username: S.turn.user, credential: S.turn.pass });
    return { iceServers: servers };
  }
  const initials = n => { const p = String(n || "?").trim().split(/\s+/); return ((p[0] || "?")[0] + (p[1] ? p[1][0] : "")).toUpperCase(); };

  /* ---------- icons ---------- */
  const IC = {
    mic: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>`,
    micOff: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 10V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 4.6 2.5M5.5 11a6.5 6.5 0 0 0 10.4 5.2M18.4 12.6c.07-.5.1-1 .1-1.6M12 17.5V21M3 3l18 18"/></svg>`,
    head: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4" height="6" rx="1.5"/><rect x="16.5" y="14" width="4" height="6" rx="1.5"/></svg>`,
    headOff: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 15v-3a8 8 0 0 1 12.7-6.5M19.6 9.8c.26.7.4 1.4.4 2.2v3"/><rect x="3.5" y="14" width="4" height="6" rx="1.5"/><path d="M16.5 17v1.5A1.5 1.5 0 0 0 18 20h1M3 3l18 18"/></svg>`,
    leave: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 14.5c4.7-4.7 12.3-4.7 17 0l-2.3 2.3-3.2-1.6v-2.6a10.5 10.5 0 0 0-6 0v2.6l-3.2 1.6z"/></svg>`,
    wave: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>`
  };

  /* ---------- views ---------- */
  function render() {
    const v = $("#view");
    if (!S.name) { v.innerHTML = setupView(); return; }
    v.innerHTML = S.room ? callView() : lobbyView();
  }

  function setupView() {
    return `<section class="card">
      <h2>Pick your name</h2>
      <p class="meta" style="margin:0">This is what your crew sees in voice channels. No account needed.</p>
      <form id="setup-form" class="field" style="gap:12px">
        <div class="field"><label for="nm">Gamertag</label><input id="nm" maxlength="24" autocomplete="nickname" placeholder="e.g. NightOwl" value="${esc(nameParam)}"></div>
        <div class="field"><label>Color</label><div class="swatches">${COLORS.map(c => `<button type="button" class="swatch ${c === S.color ? "sel" : ""}" data-color="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join("")}</div></div>
        <button class="btn primary" type="submit">Continue</button>
      </form>
    </section>`;
  }

  function lobbyView() {
    const rows = S.rooms.map(r => {
      const who = S.lobby[r];
      const live = who && who.length;
      return `<button class="room ${live ? "live" : ""}" data-room="${esc(r)}">
        <span class="ic">${IC.wave}</span>
        <span class="t"><b>${esc(r)}</b><span class="who">${live ? `${who.length} in call · ${esc(who.join(", "))}` : (who ? "Nobody here yet" : "Checking…")}</span></span>
        <span class="go">Join</span></button>`;
    }).join("");
    return `<div class="row" style="justify-content:space-between"><div><h2>Voice channels</h2><span class="meta">Talking as <b style="color:${esc(S.color)}">${esc(S.name)}</b> · <button class="btn ghost" style="padding:0;font-size:12.5px;color:var(--accent)" data-act="rename">Change</button></span></div>
      <button class="btn" data-act="refresh" ${S.probing ? "disabled" : ""}>${S.probing ? "Checking…" : "Refresh"}</button></div>
      ${S.err ? `<div class="banner err">${esc(S.err)}</div>` : ""}
      ${rows}
      <form id="new-room" class="row"><input id="rn" maxlength="24" placeholder="New channel name" style="flex:1;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:9px 14px;outline:none"><button class="btn" type="submit">Add</button></form>
      <div class="banner">Up to ${MAX} people per channel. Share the <strong>Invite</strong> link so friends land in the same channels as you.</div>
      <details><summary>Connection settings</summary>
        <p class="meta" style="margin-top:0">Most home Wi-Fi works without this. If calls connect but nobody can hear each other (common on mobile data or school/work networks), add a free TURN relay, for example from metered.ca, and paste its details here. Everyone in the crew should use the same one.</p>
        <form id="turn-form" class="field" style="gap:8px">
          <div class="field"><label for="tu">TURN URL</label><input id="tu" placeholder="turn:example.com:443?transport=tcp" value="${esc(S.turn.url)}"></div>
          <div class="field"><label for="tn">Username</label><input id="tn" value="${esc(S.turn.user)}" autocomplete="off"></div>
          <div class="field"><label for="tp">Password</label><input id="tp" type="password" value="${esc(S.turn.pass)}" autocomplete="off"></div>
          <button class="btn" type="submit">Save</button>
        </form>
      </details>`;
  }

  function tile(key, p, isMe) {
    const speaking = isMe ? S.meSpeaking && !S.muted : p.speaking && !p.muted;
    const muted = isMe ? S.muted : p.muted, deaf = isMe ? S.deaf : p.deaf;
    const state = isMe ? (S.local ? "You" : "Mic off") : (p.stream ? (p.weak ? `<span class="bad">Reconnecting…</span>` : "") : `<span>Connecting…</span>`);
    return `<div class="tile ${speaking ? "speaking" : ""}" data-key="${key}">
      ${muted || deaf ? `<span class="badge-ic" aria-label="${deaf ? "Deafened" : "Muted"}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M3 3l18 18"/><rect x="9" y="3" width="6" height="11" rx="3"/></svg></span>` : ""}
      <div class="av" style="background:${esc(isMe ? S.color : p.color || "#8d97a9")}">${esc(initials(isMe ? S.name : p.name))}</div>
      <div class="nm">${esc(isMe ? S.name : p.name || "Someone")}</div>
      <div class="st">${state}${deaf ? " · Deafened" : muted ? " · Muted" : ""}</div>
      ${!isMe && p.stream ? `<input type="range" min="0" max="150" value="${Math.round((p.vol ?? 1) * 100)}" data-vol="${key}" aria-label="Volume for ${esc(p.name || "Someone")}">` : ""}
    </div>`;
  }

  function callView() {
    const others = Object.entries(S.peers).filter(([, p]) => p.name || p.stream).sort((a, b) => a[0] - b[0]);
    return `<div class="call-head">
        <div class="t"><h2><span class="live-dot"></span>${esc(S.room)}</h2><span class="meta">${others.length + 1} of ${MAX} in channel</span></div>
      </div>
      ${S.err ? `<div class="banner err">${esc(S.err)}</div>` : ""}
      ${!others.length ? `<div class="banner">You're the only one here. Share the <strong>Invite</strong> link and your friends can jump in.</div>` : ""}
      <div class="grid" id="grid">${tile("me", null, true)}${others.map(([k, p]) => tile(k, p, false)).join("")}</div>
      <div class="controls">
        <div class="cbtn-wrap"><button class="cbtn ${S.muted ? "on" : ""}" data-act="mute" aria-pressed="${S.muted}" aria-label="${S.muted ? "Unmute" : "Mute"}" ${S.local ? "" : "disabled"}>${S.muted ? IC.micOff : IC.mic}</button>${S.muted ? "Unmute" : "Mute"}</div>
        <div class="cbtn-wrap"><button class="cbtn ${S.deaf ? "on" : ""}" data-act="deaf" aria-pressed="${S.deaf}" aria-label="${S.deaf ? "Undeafen" : "Deafen"}">${S.deaf ? IC.headOff : IC.head}</button>${S.deaf ? "Undeafen" : "Deafen"}</div>
        <div class="cbtn-wrap"><button class="cbtn leave" data-act="leave" aria-label="Leave channel">${IC.leave}</button>Leave</div>
      </div>`;
  }

  // Light re-render of only the speaking rings (no DOM rebuild, so sliders keep working)
  function paintSpeaking() {
    const me = document.querySelector('.tile[data-key="me"]');
    if (me) me.classList.toggle("speaking", S.meSpeaking && !S.muted);
    for (const [k, p] of Object.entries(S.peers)) {
      const t = document.querySelector(`.tile[data-key="${k}"]`);
      if (t) t.classList.toggle("speaking", !!p.speaking && !p.muted && !S.deaf);
    }
  }

  /* ---------- lobby probe: who's in each channel ---------- */
  async function probe() {
    if (S.probing || S.room || !window.Peer) return;
    S.probing = true; render();
    const result = {};
    S.rooms.forEach(r => result[r] = []);
    let pr;
    try {
      pr = new Peer({ config: iceConfig(), debug: 0 });
      await new Promise((res, rej) => { pr.on("open", res); pr.on("error", e => { if (e.type !== "peer-unavailable") rej(e); }); setTimeout(() => rej(new Error("timeout")), 8000); });
      const waits = [];
      for (const r of S.rooms) for (let s = 1; s <= MAX; s++) {
        waits.push(new Promise(res => {
          const c = pr.connect(pid(r, s), { metadata: { probe: true }, reliable: true });
          const done = () => { try { c.close(); } catch (_) {} res(); };
          const t = setTimeout(done, 4500);
          c.on("data", d => { if (d && d.t === "hello") result[r].push(String(d.name || "Someone").slice(0, 24)); clearTimeout(t); done(); });
          c.on("error", () => { clearTimeout(t); done(); });
        }));
      }
      await Promise.all(waits);
      S.lobby = result; S.err = "";
    } catch (e) {
      S.err = "Couldn't reach the voice server. Check your internet and tap Refresh.";
      S.rooms.forEach(r => { if (!S.lobby[r]) S.lobby[r] = []; });
    }
    try { pr && pr.destroy(); } catch (_) {}
    S.probing = false; render();
  }

  /* ---------- joining a channel ---------- */
  function claimSlot(room) {
    return new Promise(async (resolve, reject) => {
      for (let s = 1; s <= MAX; s++) {
        const ok = await new Promise(res => {
          const p = new Peer(pid(room, s), { config: iceConfig(), debug: 0 });
          const t = setTimeout(() => { p.destroy(); res(null); }, 9000);
          p.on("open", () => { clearTimeout(t); res(p); });
          p.on("error", e => { clearTimeout(t); if (e.type === "unavailable-id") { p.destroy(); res(false); } else if (!p.open) { p.destroy(); res(null); } });
        });
        if (ok) return resolve({ peer: ok, slot: s });
        if (ok === null) return reject(new Error("server"));
      }
      reject(new Error("full"));
    });
  }

  async function join(room) {
    if (S.joining || S.room) return;
    S.joining = true; S.err = "";
    // mic first, from the tap
    try {
      S.local = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
    } catch (e) {
      S.local = null;
      toast("No microphone access. You can still listen. Allow the mic in your browser settings to talk.");
    }
    try {
      S.ctx = S.ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (S.ctx.state === "suspended") await S.ctx.resume();
    } catch (_) {}
    if (S.local && S.ctx) { try { const src = S.ctx.createMediaStreamSource(S.local); S.meAnalyser = S.ctx.createAnalyser(); S.meAnalyser.fftSize = 512; src.connect(S.meAnalyser); } catch (_) {} }

    toast("Joining " + room + "…");
    let got;
    try { got = await claimSlot(room); }
    catch (e) {
      S.joining = false;
      stopLocal();
      S.err = e.message === "full" ? `#${room} is full (${MAX} people). Try another channel.` : "Couldn't reach the voice server. Check your internet and try again.";
      render(); return;
    }
    S.peer = got.peer; S.slot = got.slot; S.room = room; S.joining = false;
    S.muted = !S.local; applyMute();
    wirePeer();
    // newcomer reaches out to every other slot
    for (let s = 1; s <= MAX; s++) if (s !== S.slot) connectTo(s);
    render();
    if (navigator.wakeLock) navigator.wakeLock.request("screen").then(l => S.wake = l).catch(() => {});
  }

  function entry(slot) { return S.peers[slot] = S.peers[slot] || { vol: 1 }; }

  function wirePeer() {
    const peer = S.peer;
    peer.on("connection", conn => {
      if (conn.metadata && conn.metadata.probe) {
        conn.on("open", () => { conn.send({ t: "hello", name: S.name }); setTimeout(() => conn.close(), 1500); });
        return;
      }
      setupConn(conn);
    });
    peer.on("call", call => {
      const s = slotOf(call.peer);
      const ex = S.peers[s];
      const out = S.pending[s] || (ex && ex.outgoing && ex.call);
      // Tie-break when both sides called each other: the call started by the lower slot wins.
      if (out && S.slot < s) { call.close(); return; }
      if (out) { try { out.close(); } catch (_) {} delete S.pending[s]; if (ex && ex.call === out) ex.call = null; }
      call.answer(S.local || silentStream());
      setupCall(call, s, false);
    });
    peer.on("disconnected", () => { if (S.peer === peer && !peer.destroyed) { try { peer.reconnect(); } catch (_) {} } });
    peer.on("error", e => {
      if (e.type === "peer-unavailable") { // empty slot, expected
        const m = String(e.message || "").match(/savepoint-[A-Za-z0-9-]+/);
        if (m) { const s = slotOf(m[0]); if (S.pending[s]) { try { S.pending[s].close(); } catch (_) {} delete S.pending[s]; } }
        return;
      }
      if (e.type === "network" || e.type === "server-error" || e.type === "socket-error") S.err = "Lost connection to the voice server. Trying to reconnect…";
      render();
    });
  }

  function connectTo(s) {
    const id = pid(S.room, s);
    const conn = S.peer.connect(id, { metadata: { name: S.name, color: S.color }, reliable: true });
    setupConn(conn);
    const call = S.peer.call(id, S.local || silentStream(), { metadata: { name: S.name } });
    if (call) setupCall(call, s, true);
  }

  function setupConn(conn) {
    const s = slotOf(conn.peer);
    conn.on("open", () => {
      const e = entry(s);
      e.conn = conn;
      if (conn.metadata && conn.metadata.name && !e.name) { e.name = String(conn.metadata.name).slice(0, 24); e.color = conn.metadata.color; }
      conn.send({ t: "hello", name: S.name, color: S.color, muted: S.muted, deaf: S.deaf });
      render();
    });
    conn.on("data", d => {
      if (!d || typeof d !== "object") return;
      const e = entry(s);
      if (d.t === "hello" || d.t === "state") {
        if (typeof d.name === "string") e.name = d.name.slice(0, 24);
        if (typeof d.color === "string" && /^#[0-9a-f]{6}$/i.test(d.color)) e.color = d.color;
        e.muted = !!d.muted; e.deaf = !!d.deaf;
        if (d.t === "hello" && !e.greeted) { e.greeted = true; if (S.room) toast(`${e.name || "Someone"} joined`); }
        render();
      }
      if (d.t === "bye") dropPeer(s, true);
    });
    conn.on("close", () => { const e = S.peers[s]; if (e && e.conn === conn) { e.conn = null; maybeDrop(s); } });
    conn.on("error", () => {});
  }

  function setupCall(call, s, outgoing) {
    // Outgoing calls to empty slots never answer, so they wait in `pending` until a stream arrives.
    if (outgoing) S.pending[s] = call;
    else { const e0 = entry(s); e0.call = call; e0.outgoing = false; }
    call.on("stream", stream => {
      if (outgoing) { if (S.pending[s] !== call) return; delete S.pending[s]; const e1 = entry(s); if (e1.call && e1.call !== call) { try { e1.call.close(); } catch (_) {} } e1.call = call; e1.outgoing = true; }
      const e = entry(s);
      if (e.call !== call) return;
      e.stream = stream;
      if (!e.el) { e.el = new Audio(); e.el.autoplay = true; e.el.playsInline = true; document.body.appendChild(e.el); }
      e.el.srcObject = stream; e.el.muted = S.deaf; e.el.volume = Math.min(1, e.vol ?? 1);
      e.el.play().catch(() => toast("Tap anywhere to turn on sound."));
      try {
        if (S.ctx) {
          const src = S.ctx.createMediaStreamSource(stream);
          e.analyser = S.ctx.createAnalyser(); e.analyser.fftSize = 512; src.connect(e.analyser);
          if ((e.vol ?? 1) > 1) { e.gain = S.ctx.createGain(); e.gain.gain.value = e.vol; src.connect(e.gain).connect(S.ctx.destination); e.el.muted = true; }
        }
      } catch (_) {}
      render();
      watchIce(call, s);
    });
    call.on("close", () => {
      if (S.pending[s] === call) { delete S.pending[s]; return; }
      const e = S.peers[s];
      if (e && e.call === call) { e.call = null; maybeDrop(s); }
    });
    call.on("error", () => {});
  }

  function watchIce(call, s) {
    const pc = call.peerConnection;
    if (!pc) return;
    pc.addEventListener("connectionstatechange", () => {
      const e = S.peers[s]; if (!e || e.call !== call) return;
      const st = pc.connectionState;
      e.weak = st === "disconnected";
      if (st === "failed") { S.err = S.turn.url ? "A connection failed. Someone may be on a blocked network." : "Someone couldn't connect. This happens on some networks; add a TURN relay in Connection settings."; dropPeer(s, false); }
      render();
    });
  }

  function maybeDrop(s) {
    const e = S.peers[s];
    if (e && !e.conn && !e.call) dropPeer(s, true);
  }
  function dropPeer(s, announce) {
    const e = S.peers[s];
    if (!e) return;
    try { e.call && e.call.close(); } catch (_) {}
    try { e.conn && e.conn.close(); } catch (_) {}
    if (e.el) { e.el.srcObject = null; e.el.remove(); }
    if (announce && e.name && S.room) toast(`${e.name} left`);
    delete S.peers[s];
    render();
  }

  let silent = null;
  function silentStream() {
    if (silent) return silent;
    try { const ctx = S.ctx || new AudioContext(); const d = ctx.createMediaStreamDestination(); silent = d.stream; } catch (_) { silent = new MediaStream(); }
    return silent;
  }

  function broadcast(msg) { for (const e of Object.values(S.peers)) if (e.conn && e.conn.open) try { e.conn.send(msg); } catch (_) {} }
  function applyMute() { if (S.local) S.local.getAudioTracks().forEach(t => t.enabled = !S.muted && !S.deaf); }
  function sendState() { broadcast({ t: "state", name: S.name, color: S.color, muted: S.muted || !S.local, deaf: S.deaf }); }
  function stopLocal() { if (S.local) S.local.getTracks().forEach(t => t.stop()); S.local = null; S.meAnalyser = null; }

  function leave() {
    broadcast({ t: "bye" });
    for (const s of Object.keys(S.peers)) dropPeer(s, false);
    for (const c of Object.values(S.pending)) { try { c.close(); } catch (_) {} }
    S.pending = {};
    setTimeout(() => { try { S.peer && S.peer.destroy(); } catch (_) {} S.peer = null; }, 300);
    stopLocal();
    if (S.wake) { S.wake.release().catch(() => {}); S.wake = null; }
    S.room = null; S.slot = 0; S.muted = false; S.deaf = false; S.err = "";
    render(); setTimeout(probe, 800);
  }

  /* ---------- speaking meter ---------- */
  const buf = new Uint8Array(512);
  function level(an) { if (!an) return 0; an.getByteTimeDomainData(buf); let sum = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; } return Math.sqrt(sum / buf.length); }
  setInterval(() => {
    if (!S.room) return;
    S.meSpeaking = level(S.meAnalyser) > 0.035;
    for (const e of Object.values(S.peers)) e.speaking = level(e.analyser) > 0.035;
    paintSpeaking();
  }, 120);

  /* ---------- events ---------- */
  document.addEventListener("click", e => {
    if (S.ctx && S.ctx.state === "suspended") S.ctx.resume().catch(() => {});
    for (const p of Object.values(S.peers)) if (p.el && p.el.paused && !S.deaf) p.el.play().catch(() => {});
    const sw = e.target.closest(".swatch");
    if (sw) { S.color = sw.dataset.color; document.querySelectorAll(".swatch").forEach(x => x.classList.toggle("sel", x === sw)); return; }
    const room = e.target.closest("[data-room]");
    if (room) { join(room.dataset.room); return; }
    const b = e.target.closest("[data-act]");
    if (!b) return;
    const a = b.dataset.act;
    if (a === "refresh") probe();
    else if (a === "rename") { S.name = ""; render(); }
    else if (a === "mute") { S.muted = !S.muted; if (!S.muted && S.deaf) { S.deaf = false; for (const p of Object.values(S.peers)) if (p.el && !p.gain) p.el.muted = false; } applyMute(); sendState(); render(); }
    else if (a === "deaf") {
      S.deaf = !S.deaf;
      for (const p of Object.values(S.peers)) { if (p.el && !p.gain) p.el.muted = S.deaf; if (p.gain) p.gain.gain.value = S.deaf ? 0 : p.vol; }
      applyMute(); sendState(); render();
    }
    else if (a === "leave") leave();
  });

  document.addEventListener("input", e => {
    const k = e.target.dataset && e.target.dataset.vol;
    if (!k) return;
    const p = S.peers[k]; if (!p) return;
    p.vol = +e.target.value / 100;
    if (p.vol > 1 && S.ctx && p.stream) {
      if (!p.gain) { try { const src = S.ctx.createMediaStreamSource(p.stream); p.gain = S.ctx.createGain(); src.connect(p.gain).connect(S.ctx.destination); } catch (_) {} }
      if (p.gain) { p.gain.gain.value = S.deaf ? 0 : p.vol; p.el.muted = true; }
    } else {
      if (p.gain) p.gain.gain.value = 0;
      if (p.el) { p.el.muted = S.deaf; p.el.volume = p.vol; }
    }
  });

  document.addEventListener("submit", e => {
    e.preventDefault();
    if (e.target.id === "setup-form") {
      const n = $("#nm").value.trim().slice(0, 24);
      if (!n) { toast("Type a name first."); return; }
      S.name = n; store.set("name", n); store.set("color", S.color);
      render(); probe();
    } else if (e.target.id === "new-room") {
      const r = slug($("#rn").value);
      if (!r) return;
      if (!S.rooms.includes(r)) { S.rooms.push(r); store.set("rooms", S.rooms.filter(x => !DEFAULT_ROOMS.includes(x))); }
      render(); probe();
    } else if (e.target.id === "turn-form") {
      S.turn = { url: $("#tu").value.trim(), user: $("#tn").value.trim(), pass: $("#tp").value };
      store.set("turn", S.turn); toast("Saved. Rejoin a channel to use it.");
    }
  });

  $("#invite-btn").addEventListener("click", async () => {
    const url = location.origin + location.pathname + "?crew=" + encodeURIComponent(crew);
    try {
      if (navigator.share) await navigator.share({ title: "Save Point Voice", text: "Hop in voice with the crew", url });
      else { await navigator.clipboard.writeText(url); toast("Invite link copied."); }
    } catch (_) { try { await navigator.clipboard.writeText(url); toast("Invite link copied."); } catch (__) { prompt("Copy this invite link:", url); } }
  });

  window.addEventListener("pagehide", () => { if (S.room) broadcast({ t: "bye" }); });
  setInterval(() => { if (!S.room && S.name && !document.hidden) probe(); }, 30000);

  if (!window.Peer) { $("#view").innerHTML = `<div class="banner err"><strong>Couldn't load the voice engine.</strong> Check your internet and reload the page.</div>`; return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) S.err = "This browser can't use the microphone here. Open the link in Chrome.";
  render();
  if (S.name) probe().then(() => { if (roomParam && S.rooms.includes(roomParam)) { /* wait for a tap: browsers need one before using the mic */ toast(`Tap #${roomParam} to join voice.`); } });
})();
</script>
</body>
</html>
